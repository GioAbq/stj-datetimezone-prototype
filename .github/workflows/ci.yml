name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build StjDateTimeZone.slnx -c Release
      - run: dotnet test --solution StjDateTimeZone.slnx --no-build -c Release
